<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>YouTube Buddy</title>
		<script src="../content/shared.js"></script>
		<script src="../content/shared-api.js"></script>
		<script src="../content/shared-room.js"></script>
		<script src="../content/shared-buddies.js"></script>
		<script src="../content/theme.js"></script>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				width: 320px;
				margin: 0;
				padding: 16px;
				background: var(--ytb-surface);
				color: var(--ytb-ink);
				font: 13px/1.45 var(--ytb-font);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 14px;
			}
			.brand-mark {
				width: 28px;
				height: 28px;
			}
			h1 {
				margin: 0;
				font-size: 15px;
				font-weight: 800;
			}
			.status {
				margin: 0 0 14px;
				padding: 12px;
				border: 1px solid var(--ytb-line);
				border-radius: var(--ytb-r-lg);
				background: var(--ytb-surface-tint);
			}
			.row {
				display: flex;
				justify-content: space-between;
				gap: 16px;
				padding: 3px 0;
			}
			dt {
				color: var(--ytb-ink-muted);
			}
			dd {
				margin: 0;
				font-weight: 700;
				text-align: right;
			}
			.connection {
				margin: 8px 0 0;
				color: var(--ytb-ink-muted);
				font-size: 11px;
			}
			#your-room {
				width: 100%;
				padding: 10px 14px;
				border: 0;
				border-radius: 12px;
				background: var(--ytb-accent-500);
				color: var(--ytb-on-accent);
				font: 700 13px/1.2 var(--ytb-font);
				cursor: pointer;
			}
			#your-room:hover {
				background: var(--ytb-accent-600);
			}
			#your-room:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--ytb-ring);
			}
			#your-room:disabled {
				opacity: 0.6;
				cursor: default;
			}
			.feedback {
				min-height: 16px;
				margin: 6px 0 0;
				color: var(--ytb-danger-text);
				font-size: 11px;
			}
		</style>
	</head>
	<body>
		<header class="brand">
			<img class="brand-mark" src="../icons/youtube-buddy.svg" alt="" />
			<h1>YouTube Buddy</h1>
		</header>
		<dl class="status" aria-label="Room status">
			<div class="row">
				<dt>Room</dt>
				<dd id="room-state">Loading...</dd>
			</div>
			<div class="row">
				<dt>Room Code</dt>
				<dd id="room-code">Loading...</dd>
			</div>
			<div class="row">
				<dt>Buddies</dt>
				<dd id="buddy-count">0</dd>
			</div>
			<div class="row">
				<dt>Sharing</dt>
				<dd id="sharing-state">On</dd>
			</div>
			<p id="connection-state" class="connection" role="status" hidden>Can't reach the backend - retrying...</p>
		</dl>
		<button id="your-room" type="button">Your Room</button>
		<p id="launch-feedback" class="feedback" role="status"></p>
		<script src="../content/room-code.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
