<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>YouTube Buddy</title>
		<script src="../content/shared.js"></script>
		<script src="../content/theme.js"></script>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				width: 320px;
				margin: 0;
				padding: 16px;
				background: var(--ytb-surface);
				color: var(--ytb-ink);
				font: 13px/1.45 var(--ytb-font);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-bottom: 14px;
			}
			.brand-mark {
				width: 28px;
				height: 28px;
			}
			h1 {
				margin: 0;
				font-size: 15px;
				font-weight: 800;
			}
			#your-room {
				width: 100%;
				padding: 10px 14px;
				border: 0;
				border-radius: 12px;
				background: var(--ytb-accent-500);
				color: var(--ytb-on-accent);
				font: 700 13px/1.2 var(--ytb-font);
				cursor: pointer;
			}
			#your-room:hover {
				background: var(--ytb-accent-600);
			}
			#your-room:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--ytb-ring);
			}
			#your-room:disabled {
				opacity: 0.6;
				cursor: default;
			}
			.feedback:empty {
				display: none;
			}
			.feedback {
				margin: 6px 0 0;
				color: var(--ytb-danger-text);
				font-size: 11px;
			}
		</style>
	</head>
	<body>
		<header class="brand">
			<img class="brand-mark" src="../icons/youtube-buddy.svg" alt="" />
			<h1>Youtube Buddy</h1>
		</header>
		<button id="your-room" type="button">Check Out Your Room</button>
		<p id="launch-feedback" class="feedback" role="status"></p>
		<script src="popup.js"></script>
	</body>
</html>
