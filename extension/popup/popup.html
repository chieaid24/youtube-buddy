<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>YouTube Buddy</title>
		<!-- shared.js first (as in the content-script order) so window.YTB — and
		     its themeMarker helper — is defined before theme.js stamps the Theme
		     Preference. It only defines the YTB global (no DOM), so it is safe to
		     run in <head>; popup.js/room-code.js still load at the end of body. -->
		<script src="../content/shared.js"></script>
		<!-- theme.js is the single home of the bundled Nunito subset: it injects
		     the 'YTB Rounded' @font-face (and the namespaced on-video tokens,
		     inert here) so the popup and the on-video Note UI share one blob. It
		     stamps the marker from the stored preference (ADR-0008/0009). -->
		<script src="../content/theme.js"></script>
		<style>
			:root {
				/* --- Accent: soft apricot ramp (hue ~55) --- */
				--c-accent-050: oklch(97.5% 0.018 62);
				--c-accent-100: oklch(94% 0.045 60);
				--c-accent-200: oklch(88% 0.075 58);
				--c-accent-400: oklch(80% 0.1 56);
				--c-accent-500: oklch(76% 0.115 55);
				--c-accent-600: oklch(70% 0.13 52);
				--c-accent-700: oklch(60% 0.14 50);
				--c-accent-800: oklch(50% 0.13 48);

				/* --- Warm neutrals (hue ~58, very low chroma) --- */
				--c-surface: oklch(99.2% 0.006 62);
				--c-surface-tint: oklch(97.5% 0.018 62);
				--c-surface-sunk: oklch(95% 0.02 60);
				--c-line: oklch(91% 0.018 60);
				--c-line-strong: oklch(85% 0.025 58);
				--c-ink: oklch(28% 0.022 50);
				--c-ink-muted: oklch(50% 0.028 52);
				--c-ink-faint: oklch(64% 0.025 54);

				/* --- Semantic --- */
				--c-success: oklch(68% 0.14 150);
				--c-success-text: oklch(52% 0.14 150);
				--c-danger: oklch(55% 0.16 30);
				--c-danger-hover: oklch(49% 0.155 30);
				--c-danger-text: oklch(53% 0.16 30);
				--c-neutral: oklch(40% 0.02 52);
				--c-neutral-hover: oklch(34% 0.02 52);
				/* Text on filled buttons: warm near-white on danger/neutral, and a
				   FIXED dark warm ink on apricot fills in BOTH themes (pastel apricot
				   is too light for white text). */
				--c-on-fill: oklch(99% 0.005 62);
				--c-on-accent: oklch(28% 0.022 50);
				--c-backdrop: oklch(28% 0.022 50 / 0.32);

				/* --- Focus + elevation (tinted, never gray) --- */
				--c-ring: oklch(76% 0.115 55 / 0.55);
				--c-raised: oklch(99.2% 0.006 62);
				--e-pop: 0 6px 20px oklch(52% 0.06 52 / 0.2);
				--e-dialog: 0 12px 34px oklch(45% 0.06 52 / 0.26);

				/* --- Space, radius --- */
				--sp-1: 4px;
				--sp-2: 8px;
				--sp-3: 12px;
				--sp-4: 16px;
				--sp-5: 20px;
				--sp-6: 24px;
				--r-sm: 8px;
				--r-md: 12px;
				--r-lg: 16px;
				--r-pill: 999px;

				/* --- Motion --- */
				--dur-quick: 140ms;
				--dur-base: 200ms;
				--dur-slow: 300ms;
				--ease-out: cubic-bezier(0.22, 1, 0.36, 1);
				--ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1);

				--font: 'YTB Rounded', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
				color-scheme: light;
			}

			/* Warm espresso dark: same hue family, apricot lifted so it glows. */
			@media (prefers-color-scheme: dark) {
				:root {
					--c-surface: oklch(23% 0.014 52);
					--c-surface-tint: oklch(27% 0.018 52);
					--c-surface-sunk: oklch(20% 0.014 52);
					--c-line: oklch(33% 0.018 52);
					--c-line-strong: oklch(40% 0.02 52);
					--c-ink: oklch(94% 0.015 68);
					--c-ink-muted: oklch(74% 0.02 62);
					--c-ink-faint: oklch(58% 0.018 58);
					--c-accent-050: oklch(29% 0.025 55);
					--c-accent-100: oklch(33% 0.035 55);
					--c-accent-200: oklch(46% 0.06 55);
					--c-accent-500: oklch(78% 0.13 58);
					--c-accent-600: oklch(84% 0.125 60);
					--c-accent-700: oklch(68% 0.14 55);
					--c-accent-800: oklch(82% 0.12 60);
					--c-success-text: oklch(78% 0.13 150);
					--c-danger-text: oklch(72% 0.15 28);
					--c-on-accent: oklch(25% 0.02 50);
					--c-backdrop: oklch(10% 0.01 52 / 0.5);
					--c-ring: oklch(78% 0.13 58 / 0.55);
					--c-raised: oklch(28% 0.018 52);
					--e-pop: 0 8px 24px oklch(0% 0 0 / 0.45);
					--e-dialog: 0 14px 40px oklch(0% 0 0 / 0.55);
					color-scheme: dark;
				}
			}

			/* --- Theme Preference overrides (ADR-0008/0009) ---
			   theme.js stamps data-theme="light"|"dark" on <html> from the stored
			   preference. The popup keeps 'system' (the "Auto" option) unset, so the
			   media query below rules — it cannot see a YouTube page to follow (only
			   in-page surfaces track YouTube under Auto, ADR-0009). :root[data-theme=...]
			   (0,2,0) out-specifies the media query's bare :root (0,1,0), so a forced
			   mode wins over the OS in both directions. Each block re-asserts exactly
			   the tokens the dark media block flips. */
			:root[data-theme='dark'] {
				--c-surface: oklch(23% 0.014 52);
				--c-surface-tint: oklch(27% 0.018 52);
				--c-surface-sunk: oklch(20% 0.014 52);
				--c-line: oklch(33% 0.018 52);
				--c-line-strong: oklch(40% 0.02 52);
				--c-ink: oklch(94% 0.015 68);
				--c-ink-muted: oklch(74% 0.02 62);
				--c-ink-faint: oklch(58% 0.018 58);
				--c-accent-050: oklch(29% 0.025 55);
				--c-accent-100: oklch(33% 0.035 55);
				--c-accent-200: oklch(46% 0.06 55);
				--c-accent-500: oklch(78% 0.13 58);
				--c-accent-600: oklch(84% 0.125 60);
				--c-accent-700: oklch(68% 0.14 55);
				--c-accent-800: oklch(82% 0.12 60);
				--c-success-text: oklch(78% 0.13 150);
				--c-danger-text: oklch(72% 0.15 28);
				--c-on-accent: oklch(25% 0.02 50);
				--c-backdrop: oklch(10% 0.01 52 / 0.5);
				--c-ring: oklch(78% 0.13 58 / 0.55);
				--c-raised: oklch(28% 0.018 52);
				--e-pop: 0 8px 24px oklch(0% 0 0 / 0.45);
				--e-dialog: 0 14px 40px oklch(0% 0 0 / 0.55);
				color-scheme: dark;
			}
			:root[data-theme='light'] {
				--c-surface: oklch(99.2% 0.006 62);
				--c-surface-tint: oklch(97.5% 0.018 62);
				--c-surface-sunk: oklch(95% 0.02 60);
				--c-line: oklch(91% 0.018 60);
				--c-line-strong: oklch(85% 0.025 58);
				--c-ink: oklch(28% 0.022 50);
				--c-ink-muted: oklch(50% 0.028 52);
				--c-ink-faint: oklch(64% 0.025 54);
				--c-accent-050: oklch(97.5% 0.018 62);
				--c-accent-100: oklch(94% 0.045 60);
				--c-accent-200: oklch(88% 0.075 58);
				--c-accent-500: oklch(76% 0.115 55);
				--c-accent-600: oklch(70% 0.13 52);
				--c-accent-700: oklch(60% 0.14 50);
				--c-accent-800: oklch(50% 0.13 48);
				--c-success-text: oklch(52% 0.14 150);
				--c-danger-text: oklch(53% 0.16 30);
				--c-on-accent: oklch(28% 0.022 50);
				--c-backdrop: oklch(28% 0.022 50 / 0.32);
				--c-ring: oklch(76% 0.115 55 / 0.55);
				--c-raised: oklch(99.2% 0.006 62);
				--e-pop: 0 6px 20px oklch(52% 0.06 52 / 0.2);
				--e-dialog: 0 12px 34px oklch(45% 0.06 52 / 0.26);
				color-scheme: light;
			}

			* {
				box-sizing: border-box;
			}
			[hidden] {
				display: none !important;
			}

			/* Paint the root canvas with the surface token too, not just <body>.
			   The popup frame (the initial containing block) shows at the very
			   edge; with only <body> backgrounded it stays transparent and Chrome
			   fills it white, which reads as a white rim around the panel in dark
			   mode. Backgrounding <html> makes that edge follow the theme. */
			html {
				background: var(--c-surface);
			}

			body {
				position: relative;
				width: 320px;
				margin: 0;
				padding: var(--sp-4);
				font: 400 13px/1.45 var(--font);
				color: var(--c-ink);
				background: var(--c-surface);
			}

			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
			}

			/* ---------- header: title + nickname ---------- */

			.header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--sp-3);
				margin-bottom: var(--sp-5);
			}
			.brand {
				display: inline-flex;
				flex: none;
				align-items: center;
				gap: 6px;
			}
			.brand-mark {
				display: block;
				width: 24px;
				height: 24px;
			}
			h1 {
				margin: 0;
				font-size: 15px;
				line-height: 1.2;
				font-weight: 800;
				white-space: nowrap;
			}
			/* The one bit of logo-adjacent play: a typographic apricot full stop. */
			h1 .hdot {
				color: var(--c-accent-600);
			}

			#name-field {
				width: 130px;
			}
			#name-field.is-locked .field-edit {
				display: none;
			}
			#name-field:not(.is-locked) .field-locked {
				display: none;
			}

			input[type='text'] {
				width: 100%;
				padding: 7px 10px;
				font: 400 13px/1.45 var(--font);
				color: var(--c-ink);
				background: var(--c-surface-sunk);
				border: 1px solid var(--c-line-strong);
				border-radius: var(--r-sm);
				outline: none;
				text-overflow: ellipsis;
				transition:
					border-color var(--dur-quick) var(--ease-out),
					box-shadow var(--dur-quick) var(--ease-out);
			}
			input[type='text']::placeholder {
				color: var(--c-ink-faint);
			}
			input[type='text']:focus-visible {
				border-color: var(--c-accent-500);
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			#name {
				text-align: right;
			}

			/* Locked nickname: a soft cream chip with a bare pencil at its edge. */
			.field-locked {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 2px;
				padding: 3px 4px 3px 12px;
				background: var(--c-accent-050);
				border-radius: var(--r-pill);
			}
			.locked-value {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-weight: 600;
			}

			/* Bare icon buttons (pencil, copy): no box, icon darkens on hover. */
			.icon-btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				flex: none;
				padding: 0;
				border: none;
				background: none;
				color: var(--c-ink-muted);
				cursor: pointer;
				border-radius: var(--r-sm);
				transition: color var(--dur-quick) var(--ease-out);
			}
			.icon-btn:hover {
				color: var(--c-ink);
			}
			.icon-btn:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			#name-edit {
				width: 26px;
				height: 26px;
			}
			#name-edit svg {
				width: 14px;
				height: 14px;
			}
			#settings-open {
				width: 26px;
				height: 26px;
			}
			#settings-open svg {
				width: 15px;
				height: 15px;
			}

			/* ---------- section eyebrow ---------- */

			.eyebrow {
				display: block;
				margin: 0 0 var(--sp-1) 2px;
				font-size: 11px;
				line-height: 1.3;
				font-weight: 600;
				color: var(--c-ink-muted);
			}

			/* ---------- views (chooser / join / connected) ---------- */

			.view {
				animation: view-in var(--dur-base) var(--ease-out) both;
			}
			@keyframes view-in {
				from {
					opacity: 0;
					transform: translateY(6px);
				}
			}

			/* ---------- buttons ---------- */

			button {
				font-family: var(--font);
			}
			.btn {
				padding: 9px 14px;
				font: 600 13px/1.3 var(--font);
				color: var(--c-ink);
				background: var(--c-surface-sunk);
				border: 1px solid transparent;
				border-radius: var(--r-md);
				cursor: pointer;
				white-space: nowrap;
				transition:
					background var(--dur-quick) var(--ease-out),
					color var(--dur-quick) var(--ease-out),
					border-color var(--dur-quick) var(--ease-out),
					box-shadow var(--dur-quick) var(--ease-out),
					transform var(--dur-base) var(--ease-spring);
			}
			.btn:active {
				transform: scale(0.97);
			}
			.btn:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			.btn:disabled {
				color: var(--c-ink-faint);
				background: var(--c-surface-sunk);
				border-color: transparent;
				cursor: not-allowed;
				transform: none;
			}
			.btn-primary {
				background: var(--c-accent-500);
				color: var(--c-on-accent);
			}
			.btn-primary:hover {
				background: var(--c-accent-600);
			}
			.btn-secondary {
				background: var(--c-surface-tint);
				border-color: var(--c-line-strong);
			}
			.btn-secondary:hover {
				background: var(--c-accent-100);
			}
			.btn-danger {
				background: var(--c-danger);
				color: var(--c-on-fill);
			}
			.btn-danger:hover {
				background: var(--c-danger-hover);
			}
			.btn-neutral {
				background: var(--c-neutral);
				color: var(--c-on-fill);
			}
			.btn-neutral:hover {
				background: var(--c-neutral-hover);
			}

			.link {
				margin-top: var(--sp-2);
				padding: 2px 2px;
				border: none;
				background: none;
				color: var(--c-accent-800);
				font: 600 13px/1.3 var(--font);
				cursor: pointer;
				border-radius: var(--r-sm);
				white-space: normal;
				/* 24px hit minimum (UA-007) without changing the text's weight. */
				min-height: 24px;
			}
			.link:hover {
				text-decoration: underline;
			}
			.link:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}

			/* ---------- chooser ---------- */

			.chooser {
				display: flex;
				flex-direction: column;
				gap: var(--sp-2);
			}
			.chooser .btn {
				width: 100%;
			}

			/* Inline feedback lines (create / join errors, copy result). */
			.feedback {
				display: block;
				min-height: 16px;
				margin: var(--sp-1) 0 0 2px;
				font-size: 11px;
				line-height: 1.3;
				font-weight: 600;
				color: var(--c-success-text);
			}
			.feedback.is-error {
				color: var(--c-danger-text);
			}

			/* ---------- join ---------- */

			.join-row {
				display: flex;
				gap: var(--sp-2);
			}
			.join-row input {
				flex: 1;
				min-width: 0;
			}
			#join-submit {
				flex: none;
				min-width: 60px;
			}

			/* ---------- connected: code hero + copy ---------- */

			.code-row {
				display: flex;
				align-items: center;
				gap: var(--sp-1);
				margin-bottom: var(--sp-3);
			}
			#code {
				flex: 0 1 auto;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 16px;
				line-height: 1.2;
				font-weight: 800;
				color: var(--c-accent-800);
			}
			#copy-code {
				position: relative;
				width: 32px;
				height: 30px;
			}
			/* Copy/check overlay: crossfade, and the check pops with the spring. */
			#copy-code svg {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 15px;
				height: 15px;
				transform: translate(-50%, -50%) scale(1);
				opacity: 1;
				transition:
					opacity var(--dur-quick) var(--ease-out),
					transform var(--dur-base) var(--ease-spring);
			}
			#copy-code .icon-check {
				opacity: 0;
				transform: translate(-50%, -50%) scale(0.5);
				color: var(--c-success-text);
			}
			#copy-code.is-copied .icon-copy {
				opacity: 0;
				transform: translate(-50%, -50%) scale(0.5);
			}
			#copy-code.is-copied .icon-check {
				opacity: 1;
				transform: translate(-50%, -50%) scale(1);
			}
			#copy-feedback {
				flex: 0 1 auto;
				min-width: 0;
				min-height: 0;
				margin: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			/* ---------- connected: status panel ---------- */

			.status-panel {
				padding: var(--sp-3);
				background: var(--c-surface-tint);
				border-radius: var(--r-lg);
			}
			.status-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--sp-2);
				min-height: 24px;
			}
			.status-cue {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				min-width: 0;
				font-weight: 600;
			}
			.status-cue .dot {
				flex: none;
				width: 8px;
				height: 8px;
				border-radius: var(--r-pill);
				background: var(--c-accent-500);
			}
			/* The only looping animation: the waiting dot breathes. */
			.status-panel[data-state='waiting'] .dot {
				animation: breathe 1.6s var(--ease-out) infinite;
			}
			@keyframes breathe {
				0%,
				100% {
					opacity: 0.45;
					transform: scale(0.8);
				}
				50% {
					opacity: 1;
					transform: scale(1);
				}
			}
			.status-cue .lock {
				display: none;
				flex: none;
				width: 14px;
				height: 14px;
				color: var(--c-ink-muted);
			}
			.status-panel[data-state='full'] .dot,
			.status-panel[data-state='inroom'] .dot,
			.status-panel[data-state='unpaired'] .dot {
				display: none;
			}
			.status-panel[data-state='full'] .lock {
				display: block;
			}
			/* In room, the cue line drops to an eyebrow over the roster. */
			.status-panel[data-state='inroom'] #status-text {
				font-size: 11px;
				line-height: 1.3;
				font-weight: 600;
				color: var(--c-ink-muted);
			}
			#status-sub {
				margin: var(--sp-1) 0 0 2px;
				font-size: 11px;
				line-height: 1.3;
				font-weight: 500;
				color: var(--c-ink-muted);
			}
			.status-panel[data-state='full'] #status-sub {
				margin-left: 22px;
			}

			/* Sharing state on the main view: read-only while on, compact while off. */
			.sharing-on {
				display: inline-flex;
				align-items: center;
				flex: none;
				gap: 6px;
				font: 600 11px/1.3 var(--font);
				color: var(--c-ink-muted);
			}
			.sharing-dot {
				width: 7px;
				height: 7px;
				border-radius: var(--r-pill);
				background: var(--c-success);
			}
			.btn-status {
				flex: none;
				min-height: 24px;
				padding: 4px 9px;
				font-size: 11px;
			}

			/* ---------- roster ---------- */

			.roster {
				display: flex;
				flex-direction: column;
				gap: 2px;
				margin-top: var(--sp-1);
			}
			.roster:empty {
				display: none;
				margin: 0;
			}
			.buddy {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				margin: 0 -6px;
				padding: 3px 6px;
				border-radius: var(--r-sm);
				transition: background var(--dur-quick) var(--ease-out);
			}
			.buddy:hover {
				background: var(--c-accent-100);
			}
			.buddy.is-new {
				animation: row-in var(--dur-slow) var(--ease-spring) both;
			}
			@keyframes row-in {
				from {
					opacity: 0;
					transform: translateY(6px);
				}
			}

			/* Swatch = 24px hit target around a 12px 2px-radius square: the square
			   is the legend for the square on-video markers, so it never rounds. */
			.swatch {
				display: grid;
				place-items: center;
				flex: none;
				width: 24px;
				height: 24px;
				margin-left: -4px;
				padding: 0;
				border: none;
				border-radius: var(--r-sm);
				background: none;
				cursor: pointer;
				transition: background var(--dur-quick) var(--ease-out);
			}
			.swatch:hover {
				background: var(--c-accent-200);
			}
			.swatch:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			.swatch .chip {
				width: 12px;
				height: 12px;
				border-radius: 2px;
			}
			.swatch.is-picked .chip {
				animation: wiggle 180ms var(--ease-out);
			}
			@keyframes wiggle {
				25% {
					transform: rotate(4deg);
				}
				75% {
					transform: rotate(-4deg);
				}
			}

			.buddy-name {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-weight: 600;
			}
			.buddy-seen {
				flex: none;
				margin-left: auto;
				font-size: 11px;
				font-weight: 500;
				color: var(--c-ink-muted);
				white-space: nowrap;
			}

			/* ---------- settings view ---------- */

			.settings-head {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				margin-bottom: var(--sp-3);
			}
			.settings-title {
				margin: 0;
				font-size: 15px;
				line-height: 1.2;
				font-weight: 800;
			}
			#settings-back {
				width: 26px;
				height: 26px;
			}
			#settings-back svg {
				width: 15px;
				height: 15px;
			}

			.set-group {
				margin-bottom: var(--sp-4);
			}
			.set-group:last-child {
				margin-bottom: 0;
			}

			/* Theme: a three-way segmented control on a sunk track. */
			.seg {
				display: flex;
				gap: 2px;
				padding: 3px;
				background: var(--c-surface-sunk);
				border-radius: var(--r-md);
			}
			.seg-btn {
				flex: 1;
				padding: 6px 0;
				border: none;
				border-radius: var(--r-sm);
				background: transparent;
				font: 600 13px/1.3 var(--font);
				color: var(--c-ink-muted);
				cursor: pointer;
				transition:
					background var(--dur-quick) var(--ease-out),
					color var(--dur-quick) var(--ease-out);
			}
			.seg-btn:hover {
				color: var(--c-ink);
			}
			.seg-btn:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			.seg-btn[aria-checked='true'] {
				background: var(--c-surface);
				color: var(--c-ink);
				font-weight: 700;
				box-shadow: 0 1px 3px oklch(45% 0.06 52 / 0.18);
			}

			/* Notification Position: a 16:9 "monitor" with one clickable cell at
			   each edge midpoint, laid out as a plus. */
			.edge-picker {
				box-sizing: border-box;
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				grid-template-rows: repeat(3, 1fr);
				gap: 4px;
				width: 176px;
				aspect-ratio: 16 / 9;
				padding: 6px;
				border: 1px solid var(--c-line-strong);
				border-radius: var(--r-md);
				background: var(--c-surface-sunk);
			}
			.edge-cell {
				padding: 0;
				border: 1px solid var(--c-line-strong);
				border-radius: var(--r-sm);
				background: var(--c-surface);
				cursor: pointer;
				transition:
					background var(--dur-quick) var(--ease-out),
					border-color var(--dur-quick) var(--ease-out);
			}
			/* Placement is by edge, independent of DOM (reading) order. */
			.edge-cell[data-edge='top'] {
				grid-area: 1 / 2;
			}
			.edge-cell[data-edge='left'] {
				grid-area: 2 / 1;
			}
			.edge-cell[data-edge='right'] {
				grid-area: 2 / 3;
			}
			.edge-cell[data-edge='bottom'] {
				grid-area: 3 / 2;
			}
			.edge-cell:hover {
				border-color: var(--c-accent-500);
				background: var(--c-accent-100);
			}
			.edge-cell:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			.edge-cell[aria-checked='true'] {
				background: var(--c-accent-500);
				border-color: var(--c-accent-600);
			}
			.set-hint {
				margin: var(--sp-1) 0 0 2px;
				font-size: 11px;
				line-height: 1.3;
				font-weight: 500;
				color: var(--c-ink-muted);
			}

			/* Toggle rows: label (+ small sub-line) left, switch right. */
			.set-row {
				display: flex;
				align-items: center;
				gap: var(--sp-2);
				width: calc(100% + 12px);
				margin: 0 -6px;
				padding: 7px 6px;
				border: none;
				border-radius: var(--r-sm);
				background: none;
				font: 600 13px/1.3 var(--font);
				color: var(--c-ink);
				text-align: left;
				cursor: pointer;
				transition: background var(--dur-quick) var(--ease-out);
			}
			.set-row:hover {
				background: var(--c-accent-050);
			}
			.set-row:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			.set-row-text {
				flex: 1 1 auto;
				min-width: 0;
			}
			.set-sub {
				display: block;
				font-size: 11px;
				line-height: 1.3;
				font-weight: 500;
				color: var(--c-ink-muted);
			}
			.switch {
				position: relative;
				flex: none;
				width: 30px;
				height: 16px;
				border-radius: var(--r-pill);
				background: var(--c-line-strong);
				transition: background var(--dur-base) var(--ease-out);
			}
			.set-row[aria-checked='true'] .switch {
				background: var(--c-accent-500);
			}
			.switch-knob {
				position: absolute;
				top: 2px;
				left: 2px;
				width: 12px;
				height: 12px;
				border-radius: 50%;
				background: var(--c-surface);
				box-shadow: 0 1px 2px oklch(45% 0.06 52 / 0.25);
				transition: transform var(--dur-base) var(--ease-spring);
			}
			.set-row[aria-checked='true'] .switch-knob {
				transform: translateX(14px);
			}

			/* Room actions. */
			.room-actions {
				display: flex;
				gap: var(--sp-2);
			}
			.room-actions .btn {
				flex: 1;
			}

			/* ---------- color grid popover ---------- */

			.color-grid {
				position: absolute;
				z-index: 50;
				display: grid;
				grid-template-columns: repeat(4, 26px);
				gap: 2px;
				padding: 6px;
				background: var(--c-raised);
				border: 1px solid var(--c-line);
				border-radius: var(--r-md);
				box-shadow: var(--e-pop);
				animation: pop-in var(--dur-quick) var(--ease-out) both;
			}
			@keyframes pop-in {
				from {
					opacity: 0;
					transform: scale(0.96);
				}
			}
			.color-choice {
				display: grid;
				place-items: center;
				width: 26px;
				height: 26px;
				padding: 0;
				border: none;
				border-radius: var(--r-sm);
				background: none;
				cursor: pointer;
				transition: background var(--dur-quick) var(--ease-out);
			}
			.color-choice .chip {
				width: 14px;
				height: 14px;
				border-radius: 2px;
			}
			.color-choice:hover:not(:disabled) {
				background: var(--c-accent-100);
			}
			.color-choice:focus-visible {
				outline: none;
				box-shadow: 0 0 0 3px var(--c-ring);
			}
			.color-choice[aria-pressed='true'] .chip {
				outline: 2px solid var(--c-ink);
				outline-offset: 1px;
			}
			.color-choice:disabled {
				opacity: 0.28;
				cursor: not-allowed;
			}

			/* ---------- footer ---------- */

			footer {
				margin-top: var(--sp-4);
				padding-top: var(--sp-3);
				border-top: 1px solid var(--c-line);
				font-size: 11px;
				line-height: 1.3;
				font-weight: 500;
				color: var(--c-ink-muted);
			}
			footer .url {
				word-break: break-all;
			}

			/* ---------- confirm dialog ---------- */

			.confirm-overlay {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: var(--sp-4);
				background: var(--c-backdrop);
				animation: fade-in var(--dur-quick) var(--ease-out) both;
			}
			@keyframes fade-in {
				from {
					opacity: 0;
				}
			}
			.confirm-box {
				width: 100%;
				padding: var(--sp-4);
				background: var(--c-raised);
				border-radius: var(--r-lg);
				box-shadow: var(--e-dialog);
				animation: dialog-in var(--dur-base) var(--ease-spring) both;
			}
			@keyframes dialog-in {
				from {
					opacity: 0;
					transform: scale(0.96);
				}
			}
			.confirm-title {
				margin: 0 0 var(--sp-1);
				font-size: 15px;
				font-weight: 800;
			}
			.confirm-body {
				margin: 0 0 var(--sp-4);
				font-size: 13px;
				color: var(--c-ink-muted);
			}
			.confirm-actions {
				display: flex;
				gap: var(--sp-2);
				justify-content: flex-end;
			}

			/* ---------- reduced motion: springs and slides out, short fades stay ---------- */

			@media (prefers-reduced-motion: reduce) {
				.view,
				.buddy.is-new,
				.confirm-overlay,
				.confirm-box,
				.color-grid {
					animation: none;
				}
				.status-panel[data-state='waiting'] .dot,
				.swatch.is-picked .chip {
					animation: none;
				}
				.btn,
				.btn:active {
					transform: none;
					transition-property: background, color, border-color, box-shadow;
				}
				.switch,
				.switch-knob {
					transition: none;
				}
				#copy-code svg {
					transition: opacity var(--dur-quick) ease-out;
					transform: translate(-50%, -50%);
				}
				#copy-code .icon-check,
				#copy-code.is-copied .icon-copy {
					transform: translate(-50%, -50%);
				}
			}
		</style>
	</head>
	<body>
		<header class="header">
			<div class="brand">
				<img class="brand-mark" src="../icons/youtube-buddy.svg" alt="" aria-hidden="true" />
				<h1>YouTube Buddy<span class="hdot" aria-hidden="true">.</span></h1>
			</div>
			<div id="name-field">
				<label class="sr-only" for="name">Nickname</label>
				<!-- Locked once set; the pencil reopens the input (cosmetic, unguarded). -->
				<div class="field-locked">
					<span class="locked-value" id="name-value"></span>
					<button id="name-edit" type="button" class="icon-btn" aria-label="Edit nickname">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
							<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
						</svg>
					</button>
				</div>
				<div class="field-edit">
					<input id="name" type="text" placeholder='Buddy "Buddy" McGee' autocomplete="off" />
				</div>
			</div>
			<button id="settings-open" type="button" class="icon-btn" aria-label="Settings" title="Settings">
				<svg
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
				>
					<circle cx="12" cy="12" r="3"></circle>
					<path
						d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
					></path>
				</svg>
			</button>
		</header>

		<section id="room-section">
			<h2 class="eyebrow">Room code</h2>

			<!-- Chooser: shown when there is no code yet, or after "Leave room". -->
			<div id="view-chooser" class="view" hidden>
				<div class="chooser">
					<button id="choose-create" type="button" class="btn btn-primary">Create a room</button>
					<button id="choose-join" type="button" class="btn btn-secondary">Join a room</button>
				</div>
				<span id="create-feedback" class="feedback" role="status" aria-live="polite"></span>
				<button id="chooser-cancel" type="button" class="link" hidden>Cancel</button>
			</div>

			<!-- Join: type a Buddy's code (free text, must match a real code). -->
			<div id="view-join" class="view" hidden>
				<div class="join-row">
					<input id="join-input" type="text" placeholder="The Something Somethings" autocomplete="off" spellcheck="false" />
					<button id="join-submit" type="button" class="btn" disabled>Join</button>
				</div>
				<span id="join-feedback" class="feedback" role="status" aria-live="polite"></span>
				<button id="join-back" type="button" class="link">Back</button>
			</div>

			<!-- Connected: the pretty code is the hero; status lives in one cream panel. -->
			<div id="view-connected" class="view" hidden>
				<div class="code-row">
					<span id="code"></span>
					<button id="copy-code" type="button" class="icon-btn" aria-label="Copy code" title="Copy">
						<svg
							class="icon-copy"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
							<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
						</svg>
						<svg
							class="icon-check"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M20 6 9 17l-5-5"></path>
						</svg>
					</button>
					<span id="copy-feedback" class="feedback" role="status" aria-live="polite"></span>
				</div>

				<div id="status" class="status-panel" data-state="unpaired">
					<div class="status-row">
						<span class="status-cue">
							<span class="dot" aria-hidden="true"></span>
							<svg
								class="lock"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
								<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
							</svg>
							<span id="status-text"></span>
						</span>
						<!-- Sharing on: read-only. Sharing off: compact one-click turn-on. -->
						<span id="sharing-on" class="sharing-on" hidden>
							<span class="sharing-dot" aria-hidden="true"></span>
							Sharing on
						</span>
						<button id="sharing-turn-on" type="button" class="btn btn-secondary btn-status" hidden>Turn on sharing</button>
					</div>
					<p id="status-sub" hidden></p>
					<div id="roster" class="roster"></div>
				</div>
			</div>
		</section>

		<!-- Settings: the fourth mutually-exclusive view (gear in the header). -->
		<section id="view-settings" class="view" hidden>
			<div class="settings-head">
				<button id="settings-back" type="button" class="icon-btn" aria-label="Back">
					<svg
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M19 12H5"></path>
						<path d="m12 19-7-7 7-7"></path>
					</svg>
				</button>
				<h2 class="settings-title">Settings</h2>
			</div>

			<div class="set-group">
				<h3 class="eyebrow">Theme</h3>
				<div id="theme-seg" class="seg" role="radiogroup" aria-label="Theme Preference">
					<button type="button" class="seg-btn" role="radio" aria-checked="false" data-theme-choice="light">Light</button>
					<button type="button" class="seg-btn" role="radio" aria-checked="false" data-theme-choice="dark">Dark</button>
					<button type="button" class="seg-btn" role="radio" aria-checked="true" data-theme-choice="system">Auto</button>
				</div>
			</div>

			<div class="set-group">
				<h3 class="eyebrow">Notification position</h3>
				<!-- Edge cells are built by popup.js from YTB.NOTIFICATION_EDGES. -->
				<div id="edge-picker" class="edge-picker" role="radiogroup" aria-label="Notification Position"></div>
				<p class="set-hint">Where playback notifications appear on the video.</p>
			</div>

			<div class="set-group">
				<h3 class="eyebrow">On video</h3>
				<button id="settings-sharing" type="button" class="set-row" role="switch" aria-checked="true">
					<span class="set-row-text">
						Share video progress
						<span class="set-sub">Let Buddies see where you left off</span>
					</span>
					<span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
				</button>
				<button id="set-notes" type="button" class="set-row" role="switch" aria-checked="true">
					<span class="set-row-text">
						Notes
						<span class="set-sub">Dots, previews, and playback notifications</span>
					</span>
					<span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
				</button>
				<button id="set-progress" type="button" class="set-row" role="switch" aria-checked="true">
					<span class="set-row-text">
						Buddy progress
						<span class="set-sub">Timeline markers and thumbnail dots</span>
					</span>
					<span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
				</button>
				<button id="set-spoiler" type="button" class="set-row" role="switch" aria-checked="true">
					<span class="set-row-text">
						Spoiler by default
						<span class="set-sub">New notes start marked as spoilers</span>
					</span>
					<span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
				</button>
			</div>

			<div class="set-group">
				<h3 class="eyebrow">Home page</h3>
				<button id="set-home" type="button" class="set-row" role="switch" aria-checked="true">
					<span class="set-row-text">
						Buddy Room section
						<span class="set-sub">The Room panel on YouTube Home</span>
					</span>
					<span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
				</button>
			</div>

			<!-- Room actions. Hidden while Unpaired. -->
			<div id="settings-room" class="set-group" hidden>
				<h3 class="eyebrow">Room</h3>
				<div class="room-actions">
					<button id="leave-room" type="button" class="btn btn-danger">Leave room</button>
				</div>
			</div>
		</section>

		<div id="color-grid" class="color-grid" role="grid" aria-label="Choose Buddy Color" hidden></div>

		<footer>Backend: <span id="backend-url" class="url"></span></footer>

		<div id="confirm-overlay" class="confirm-overlay" hidden>
			<div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
				<p class="confirm-title" id="confirm-title"></p>
				<p class="confirm-body" id="confirm-body"></p>
				<div class="confirm-actions">
					<button id="confirm-cancel" type="button" class="btn btn-secondary">Cancel</button>
