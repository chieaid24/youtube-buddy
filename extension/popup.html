<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Buddy</title>
    <style>
      :root {
        --fg: #0f0f0f;
        --muted: #606060;
        --line: #e5e5e5;
        --accent: #065fd4;
        --bg: #ffffff;
        --paired: #2ba640;
        --waiting: #c79100;
        --unpaired: #909090;
        --full: #444444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px 14px 12px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Arial, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 600;
      }
      .field {
        margin-bottom: 12px;
      }
      label.lbl {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      input[type="text"] {
        width: 100%;
        padding: 7px 9px;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: var(--accent);
      }
      #code {
        text-transform: uppercase;
      }
      .code-row {
        display: flex;
        gap: 6px;
      }
      .code-row input {
        flex: 1;
      }
      button {
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--fg);
        background: #f2f2f2;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background: #e8e8e8;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fafafa;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--unpaired);
      }
      .status.is-paired .dot,
      .status.is-ingroup .dot {
        background: var(--paired);
      }
      .status.is-waiting .dot {
        background: var(--waiting);
      }
      .status.is-unpaired .dot {
        background: var(--unpaired);
      }
      .status.is-full .dot {
        background: var(--full);
      }
      #status-text {
        font-weight: 600;
      }
      #status-sub {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .roster {
        margin: 8px 0 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .roster:empty {
        display: none;
      }
      .buddy {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .buddy .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: 0 0 auto;
      }
      .buddy .buddy-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .buddy .buddy-seen {
        margin-left: auto;
        color: var(--muted);
        white-space: nowrap;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 14px 0 12px;
      }
      .toggle-row .name {
        font-weight: 600;
      }
      .toggle-row .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      /* Sharing switch — a real checkbox styled as a toggle */
      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 22px;
        flex: 0 0 auto;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #cccccc;
        border-radius: 22px;
        transition: background 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        top: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.15s;
      }
      .switch input:checked + .slider {
        background: var(--accent);
      }
      .switch input:checked + .slider::before {
        transform: translateX(16px);
      }
      .switch input:focus-visible + .slider {
        box-shadow: 0 0 0 2px rgba(6, 95, 212, 0.4);
      }
      footer {
        margin-top: 4px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      footer .url {
        word-break: break-all;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>YouTube Buddy</h1>

    <div class="field">
      <label class="lbl" for="name">Display Name</label>
      <input id="name" type="text" placeholder="Your name" autocomplete="off" />
    </div>

    <div class="field">
      <label class="lbl" for="code">Friend Code</label>
      <div class="code-row">
        <input
          id="code"
          type="text"
          placeholder="Enter code"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="generate" type="button">Generate</button>
      </div>
    </div>

    <div id="status" class="status is-unpaired">
      <span class="dot"></span>
      <span id="status-text">Unpaired</span>
    </div>
    <p id="status-sub"></p>
    <div id="roster" class="roster"></div>

    <div class="toggle-row">
      <div>
        <div class="name">Sharing</div>
        <div class="hint">Share your watch progress with your Buddy</div>
      </div>
      <label class="switch">
        <input id="sharing" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <footer>
      Backend: <span id="backend-url" class="url"></span>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
